openapi: 3.0.3
info:
  title: MediTriage API
  description: API RESTful principal para el sistema de priorización de pacientes y asistencia clínica mediante IA.
  version: 1.0.0
  contact:
    name: Equipo MediTriage

servers:
  - url: http://localhost:8000/api/v1
    description: Servidor Local (Desarrollo)
  - url: https://api.meditriage.com/v1
    description: Servidor de Producción

tags:
  - name: Pacientes
    description: Gestión de pacientes en admisión y sala de espera.
  - name: Triages
    description: Creación de evaluaciones, IA y actualización de estados.
  - name: Auditoría
    description: Trazabilidad y logs inmutables de decisiones médicas.

paths:
  /patients:
    post:
      tags:
        - Pacientes
      summary: Registra un nuevo paciente
      operationId: createPatient
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '201':
          description: Paciente creado exitosamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Pacientes
      summary: Obtiene la lista de pacientes
      operationId: listPatients
      parameters:
        - name: skip
          in: query
          description: Paginación - registros a saltar
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: Paginación - límite de registros
          schema:
            type: integer
            default: 20
        - name: rut
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de pacientes devuelta con éxito
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /triages:
    post:
      tags:
        - Triages
      summary: Crea una evaluación de triage y consulta IA
      operationId: createTriage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '201':
          description: Triage creado y evaluado por IA
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Triages
      summary: Lista de triages activos (Tablero Médico)
      operationId: listTriages
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          schema:
            type: string
            enum: [waiting, attending, discharged]
        - name: esi_level
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de triages priorizados
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /triages/{triage_id}:
    patch:
      tags:
        - Triages
      summary: Actualiza el estado de flujo del paciente
      operationId: updateTriageStatus
      parameters:
        - name: triage_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado actualizado exitosamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /triages/{triage_id}/overrides:
    post:
      tags:
        - Triages
      summary: Sobrescribe el nivel ESI sugerido por la IA
      operationId: overrideTriageEsi
      parameters:
        - name: triage_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '201':
          description: Sobrescritura registrada exitosamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /audit-logs:
    get:
      tags:
        - Auditoría
      summary: Obtiene el historial inmutable de discrepancias
      operationId: listAuditLogs
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: has_discrepancy
          in: query
          schema:
            type: boolean
        - name: user_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Historial de auditoría devuelto
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    # Aquí definimos la estructura de los datos (Modelos)
    Patient:
      type: object
      properties:
        rut:
          type: string
          example: "11.111.111-1"
        name:
          type: string
          example: "Juan Pérez"
        has_consent:
          type: boolean
          example: true
    TriageOverride:
      type: object
      required:
        - new_esi_level
        - justification
      properties:
        new_esi_level:
          type: integer
          example: 2
        justification:
          type: string
          example: "Paciente presenta dificultad respiratoria severa no captada en triage inicial."

    # Formato de error estándar RFC 7807 (Problem Details for HTTP APIs)
    Problem:
      type: object
      description: >
        Detalle de un error según RFC 7807. Se devuelve con el content type
        `application/problem+json`. No debe incluir datos personales (PII) del paciente.
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: URI que identifica el tipo de problema. Si no hay una específica, se usa `about:blank`.
          default: "about:blank"
          example: "https://api.meditriage.com/problems/validation-error"
        title:
          type: string
          description: Resumen corto y legible del problema, igual para todas las ocurrencias del mismo tipo.
          example: "Error de validación"
        status:
          type: integer
          description: Código de estado HTTP de esta respuesta.
          minimum: 400
          maximum: 599
          example: 422
        detail:
          type: string
          description: Explicación específica de esta ocurrencia del problema.
          example: "El campo heart_rate debe estar entre 20 y 300."
        instance:
          type: string
          format: uri-reference
          description: URI que identifica esta ocurrencia concreta del problema.
          example: "/api/v1/triages"
        errors:
          type: array
          description: Extensión opcional. Lista de errores por campo, usada en errores de validación.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                example: "vital_signs.heart_rate"
              message:
                type: string
                example: "Debe estar entre 20 y 300."

  responses:
    # Respuestas estándar de error para reutilizar (todas en formato RFC 7807)
    NotFound:
      description: El recurso solicitado no fue encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://api.meditriage.com/problems/not-found"
            title: "Recurso no encontrado"
            status: 404
            detail: "No existe una evaluación de triage con el id indicado."
            instance: "/api/v1/triages/abc123"
    Unauthorized:
      description: Token JWT faltante, inválido o expirado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://api.meditriage.com/problems/unauthorized"
            title: "No autenticado"
            status: 401
            detail: "El token de acceso falta o no es válido."
            instance: "/api/v1/triages"
    ValidationError:
      description: Los datos enviados tienen el formato correcto pero no cumplen las reglas de validación.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://api.meditriage.com/problems/validation-error"
            title: "Error de validación"
            status: 422
            detail: "Los signos vitales enviados no son válidos."
            instance: "/api/v1/triages"
            errors:
              - field: "vital_signs.heart_rate"
                message: "Debe estar entre 20 y 300."
    InternalServerError:
      description: Error inesperado del servidor. No expone detalles internos ni datos personales.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://api.meditriage.com/problems/internal-error"
            title: "Error interno del servidor"
            status: 500
            detail: "Ocurrió un error inesperado. Intenta nuevamente más tarde."
            instance: "/api/v1/triages"
    Conflict:
      description: >
        Conflicto con el estado actual del recurso. Ocurre cuando el recurso ya existe
        (por ejemplo, un paciente con el mismo RUT) o cuando se reutiliza un
        `Idempotency-Key` con un cuerpo distinto al de la solicitud original, o mientras
        la solicitud original con esa clave sigue en proceso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://api.meditriage.com/problems/conflict"
            title: "Conflicto"
            status: 409
            detail: "El Idempotency-Key ya fue usado con una solicitud distinta."
            instance: "/api/v1/patients"
    Forbidden:
      description: El usuario está autenticado pero no tiene permisos suficientes (por ejemplo, se requiere rol de auditor).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://api.meditriage.com/problems/forbidden"
            title: "Permisos insuficientes"
            status: 403
            detail: "Este recurso requiere el rol de auditor."
            instance: "/api/v1/audit-logs"
    BadRequest:
      description: La solicitud está mal formada (JSON inválido, parámetros de query o de ruta incorrectos).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://api.meditriage.com/problems/bad-request"
            title: "Solicitud inválida"
            status: 400
            detail: "El parámetro 'limit' debe ser un entero mayor o igual a 1."
            instance: "/api/v1/patients"

  parameters:
    # Parámetros que se repiten en varias rutas (como la paginación)
    SkipParam:
      name: skip
      in: query
      description: Cantidad de registros a saltar (paginación).
      required: false
      schema:
        type: integer
        default: 0
    LimitParam:
      name: limit
      in: query
      description: Cantidad máxima de registros a devolver.
      required: false
      schema:
        type: integer
        default: 20
    TriageIdParam:
      name: triage_id
      in: path
      description: ID único de la evaluación de triage.
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Clave única (UUID v4) generada por el cliente para que un POST pueda reintentarse
        sin duplicar el efecto. Si se repite la misma clave con el mismo cuerpo, el servidor
        devuelve la respuesta de la solicitud original sin volver a ejecutarla. Si se repite
        con un cuerpo distinto, o mientras la original sigue en proceso, responde 409.
        Las claves se conservan 24 horas.
      schema:
        type: string
        format: uuid
        example: "3f8a6c1e-5b7d-4e2a-9c41-2d8f0a7b6e13"

  securitySchemes:
    # Método de autenticación (el que usará tu Login de FastAPI)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
